name: Public Gold Bootstrap Sync

on:
  workflow_dispatch:
  schedule:
    - cron: "12 * * * *"

concurrency:
  group: public-gold-bootstrap-sync
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e .
      - name: Skip until database secrets are configured
        if: ${{ env.SUPABASE_URL == '' || env.SUPABASE_SERVICE_ROLE_KEY == '' }}
        run: echo "Supabase secrets are not configured yet; workflow is intentionally a no-op."
      - name: Fetch GC futures proxy and upsert
        if: ${{ env.SUPABASE_URL != '' && env.SUPABASE_SERVICE_ROLE_KEY != '' }}
        run: python -m goldlab.ingest_public --symbol 'GC=F' --interval 1m --range 1d --write-supabase
